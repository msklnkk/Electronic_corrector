services:
  postgres:
    image: postgres:16-alpine3.19
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data
    env_file:
      - .env
    user: ${POSTGRES_USER}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - app_network
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: always
    volumes:
      - minio_data:/data
    networks:
      - app_network
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - app_network
    ports:
      - '127.0.0.1:2181:2181'

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    restart: always
    depends_on:
      - zookeeper
    networks:
      - app_network
    ports:
      - '127.0.0.1:29092:29092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: always
    depends_on:
      - kafka
    networks:
      - app_network
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: 'true'

  app:
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      minio:
        condition: service_started
    image: fastapi_app
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src:/app/src
    env_file:
      - .env
    networks:
      - app_network
    ports:
      - '127.0.0.1:8020:8000'
    entrypoint: sh -c "./src/start.sh"
    environment:
      - GRPC_CHECKER_HOST=grpc_checker
      - PYTHONPATH=/app/src:/app
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_STATUS_TOPIC=document-status-events
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=documents
      - MINIO_SECURE=false

  grpc_checker:
    depends_on:
      kafka:
        condition: service_started
    build:
      context: .
      dockerfile: grpc_checker/Dockerfile
    image: grpc_checker
    restart: always
    volumes:
      - ./grpc_checker/rules:/app/rules
      - ./src:/app/src
    networks:
      - app_network
    ports:
      - '127.0.0.1:50051:50051'
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/grpc_checker:/app/src
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_STATUS_TOPIC=document-status-events
      - KAFKA_GROUP_ID=bert-rules-worker-group

networks:
  app_network:
    name: app_network
    driver: bridge
    ipam:
      config:
        - subnet: 192.16.0.0/16

volumes:
  db_data:
  minio_data: