services:
  postgres:
    image: postgres:16-alpine3.19
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data
    env_file:
      - .env
    user: ${POSTGRES_USER}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - app_network
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    depends_on:
      postgres:
        condition: service_healthy
    image: fastapi_app
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src:/app/src
    env_file:
      - .env
    networks:
      - app_network
    ports:
      - '127.0.0.1:8020:8000'
    entrypoint: sh -c "./src/start.sh"
    environment:
      - GRPC_CHECKER_HOST=grpc_checker
      - PYTHONPATH=/app/src:/app  # ✅ добавлено: /app/src для project, /app для grpc_checker

  grpc_checker:
    build:
      context: .
      dockerfile: grpc_checker/Dockerfile
    image: grpc_checker
    restart: always
    volumes:
      - ./grpc_checker/rules:/app/rules
      - ./src:/app/src                    # ✅ добавлено: монтируем src чтобы видеть project
    networks:
      - app_network
    ports:
      - '127.0.0.1:50051:50051'
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/grpc_checker:/app/src  # ✅ добавлено: пути к обоим модулям

networks:
  app_network:
    name: app_network
    driver: bridge
    ipam:
      config:
        - subnet: 192.16.0.0/16

volumes:
  db_data:
